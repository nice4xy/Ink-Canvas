name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # VS 自带的 MSBuild 对 net472 WPF / COM / WinMD 引用支持最完整
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # SDK 风格的 PackageReference 工程可用 msbuild /t:Restore 还原 NuGet 包
      - name: Restore NuGet packages
        run: msbuild "Ink Canvas/Ink Canvas.csproj" /t:Restore /p:Configuration=Release

      # IAWinFX/IACore/IALoader 均为 x86 DLL，exe 必须以 32 位运行。
      # csproj 的 Prefer32Bit 条件是 '$(Platform)'=='AnyCPU'（无空格），
      # 而命令行 /p:Platform="Any CPU"（有空格）会导致条件不匹配、Prefer32Bit 失效，
      # 因此这里显式 /p:Prefer32Bit=true 强制 32 位运行。
      - name: Build
        run: msbuild "Ink Canvas/Ink Canvas.csproj" /t:Build /p:Configuration=Release /p:Platform="Any CPU" /p:Prefer32Bit=true

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: Ink-Canvas
          path: "Ink Canvas/bin/Release/"
