name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # VS 自带的 MSBuild 对 net472 WPF / COM / WinMD 引用支持最完整
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # SDK 风格的 PackageReference 工程可用 msbuild /t:Restore 还原 NuGet 包
      - name: Restore NuGet packages
        run: msbuild "Ink Canvas/Ink Canvas.csproj" /t:Restore /p:Configuration=Release

      # IAWinFX/IACore/IALoader 均为 x86 DLL，exe 必须以 32 位运行。
      # 实测 /p:Prefer32Bit=true 未生效（日志仍报格式不正确），改用 /p:PlatformTarget=x86 直接生成确定的 32 位 exe。
      - name: Build
        run: msbuild "Ink Canvas/Ink Canvas.csproj" /t:Build /p:Configuration=Release /p:Platform="Any CPU" /p:PlatformTarget=x86

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: Ink-Canvas
          path: "Ink Canvas/bin/Release/"
